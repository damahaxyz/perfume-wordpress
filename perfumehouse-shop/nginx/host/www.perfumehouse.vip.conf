server {
    listen 80;
    listen [::]:80;
    server_name perfumehouse.vip www.perfumehouse.vip;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/perfumehouse.vip;
    }

    location / {
        return 301 https://www.perfumehouse.vip$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name perfumehouse.vip www.perfumehouse.vip;

    ssl_certificate /www/server/panel/vhost/cert/perfumehouse.vip/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/perfumehouse.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:perfumehouse_ssl:10m;
    ssl_session_timeout 1d;

    if ($host = perfumehouse.vip) {
        return 301 https://www.perfumehouse.vip$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    access_log /www/wwwlogs/perfumehouse.vip.log;
    error_log /www/wwwlogs/perfumehouse.vip.error.log;
}
